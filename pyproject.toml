[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-pyats-mcp-network-automation"
version = "1.0.0"
description = "MCP server that exposes guarded Cisco pyATS operations to AI assistants such as GitHub Copilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ranil Fernando" }]
keywords = ["cisco", "pyats", "genie", "mcp", "network-automation", "copilot", "cml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = ["mcp>=1.2.0", "pyats[library]>=24.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
cisco-pyats-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/CiscoDevNet/cisco-pyats-mcp-network-automation"
Issues = "https://github.com/CiscoDevNet/cisco-pyats-mcp-network-automation/issues"

[tool.setuptools]
packages = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is documentation, not source: keep the formatter away from its snippets.
extend-exclude = ["*.md", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
